<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apex Legends 武器数据：TTK、容错、操控、命中率曲线与武器对比">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Apex Weapons Lab</title>
    <script>
      // Apply the stored / system theme before first paint to avoid a light flash in dark mode
      (function () {
        var t
        try { t = localStorage.getItem('apex-theme') } catch (e) {}
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
