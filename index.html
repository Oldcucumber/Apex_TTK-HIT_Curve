<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex_TTK-HIT_Curve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      .site-footer {
        width: min(1480px, calc(100% - 32px));
        margin: 0 auto 32px;
        padding-bottom: 20px;
        color: var(--md-sys-color-on-surface, #e2e6ee);
        font-family: 'Roboto', 'Noto Sans SC', sans-serif;
      }

      .footer-shell {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 18px;
      }

      .footer-card {
        padding: 24px;
        border-radius: 32px;
        border: 1px solid rgba(127, 139, 159, 0.18);
        background: linear-gradient(
          180deg,
          rgba(34, 44, 58, 0.94) 0%,
          rgba(23, 31, 42, 0.88) 100%
        );
        box-shadow:
          0 24px 60px rgba(3, 7, 13, 0.42),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(18px);
      }

      .footer-card h3 {
        margin: 0 0 16px;
        font-size: 1rem;
      }

      .footer-card p,
      .footer-card ul {
        margin: 0;
        padding: 0;
        list-style: none;
        line-height: 1.7;
        color: rgba(226, 230, 238, 0.78);
      }

      .footer-card li + li {
        margin-top: 8px;
      }

      .footer-card a {
        color: var(--md-sys-color-primary, #97cbff);
      }

      .footer-card a:hover {
        color: #c8e2ff;
      }

      .footer-eyebrow {
        display: block;
        margin-bottom: 10px;
        font-size: 0.74rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(151, 203, 255, 0.84);
      }

      .footer-highlight {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(127, 139, 159, 0.18);
      }

      .easter-shell {
        margin-top: 18px;
        padding: 22px 24px;
        border-radius: 28px;
        border: 1px solid rgba(127, 139, 159, 0.18);
        background: rgba(255, 255, 255, 0.03);
      }

      .easter-label {
        margin: 0 0 10px;
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(166, 176, 194, 0.82);
      }

      .target {
        min-height: 64px;
        display: grid;
        align-items: center;
        padding: 16px 18px;
        border-radius: 20px;
        background: rgba(12, 17, 24, 0.82);
        border: 1px solid rgba(127, 139, 159, 0.18);
      }

      .contentBody {
        margin: 0;
        color: rgba(226, 230, 238, 0.68);
      }

      .contentBody p {
        margin: 0;
      }

      .footer-legal {
        margin-top: 14px;
        text-align: center;
        font-size: 0.78rem;
        color: rgba(166, 176, 194, 0.82);
      }

      .footer-legal a {
        color: rgba(166, 176, 194, 0.92);
      }

      @media (max-width: 960px) {
        .site-footer {
          width: min(100%, calc(100% - 20px));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>

    <footer class="site-footer">
      <div class="footer-shell">
        <section class="footer-card">
          <span class="footer-eyebrow">Project</span>
          <h3>项目地址</h3>
          <p>
            <a href="https://github.com/Oldcucumber/Apex_TTK-HIT_Curve" target="_blank" rel="noopener noreferrer">
              Apex_TTK-HIT_Curve on GitHub
            </a>
          </p>
          <div class="footer-highlight">
            GitHub Pages 目录仍使用 `/Apex_TTK-HIT_Curve/` 作为站点基路径。
          </div>
        </section>

        <section class="footer-card">
          <span class="footer-eyebrow">People</span>
          <h3>贡献者</h3>
          <ul>
            <li><a href="https://github.com/Oldcucumber" target="_blank" rel="noopener noreferrer">Oldcucumber</a></li>
            <li><a href="https://github.com/Rebel-Gloria" target="_blank" rel="noopener noreferrer">Rebel-Gloria</a></li>
            <li><a href="https://github.com/StarVerseZ" target="_blank" rel="noopener noreferrer">StarVerseZ</a></li>
            <li><a href="https://github.com/passby6someone" target="_blank" rel="noopener noreferrer">passby6someone</a></li>
          </ul>
        </section>

        <section class="footer-card">
          <span class="footer-eyebrow">Data</span>
          <h3>数据最后更新时间</h3>
          <p>2025 / 9 / 30</p>
          <div class="footer-highlight">
            数据来源与原始思路请参考站内 “原始文档链接”。
          </div>
        </section>
      </div>

      <div class="easter-shell">
        <p class="easter-label">System Log</p>
        <div class="target" id="target">
          <div id="contentBody" class="contentBody"></div>
        </div>
      </div>

      <div class="footer-legal">
        <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">鄂ICP备2025116017号-1</a>
      </div>
    </footer>

    <script>
      const contents = [
        'Exception in tread "main"  java.lang.NullPointerException',
        'RuntimeError: CUDA error: out of memory',
        "ModuleNotFoundError: No module named 'torch'",
        'Segmentation fault (core dumped)',
        '少女折寿中......',
        '喔唷，崩溃啦',
        '你的设备遇到问题，需要重启。<br>我们只收集某些错误信息，然后为你重新启动',
        'Your device ran into a problem and needs to restart. <br> Stop code: 0xc000007b',
        "The program can't start because VCRUNTIME140.dll is missing from your computer.",
        'Bind for 0.0.0.0:8080 failed: port is already allocated',
        'Permission denied (publickey)',
        'Kernel panic - not syncing: VFS: Unable to mount root fs on unknown-block(0,0)',
        '500 Internal Server Error',
        'Error: Cannot find module \'C:\\Program Files\\nodejs\\node_modules\\npm\\bin\\npm-cli.js\'',
        'Connection to localhost:5432 refused. Is the server running on that host and accepting TCP/IP connections?'
      ]

      const totalCount = contents.length
      const targetElement = document.getElementById('target')
      const contentBodyElement = document.getElementById('contentBody')

      function updateContent() {
        const randomInt = Math.floor(Math.random() * totalCount)
        const content = contents[randomInt]
        contentBodyElement.innerHTML = '<p>' + content + '</p>'
      }

      updateContent()

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            updateContent()
          }
        })
      })

      observer.observe(targetElement)
    </script>
  </body>
</html>
